# Socle Docker — services branchés progressivement (Phases 2–8)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nejmti
      POSTGRES_PASSWORD: nejmti
      POSTGRES_DB: nejmti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ...

volumes:
  pgdata:
